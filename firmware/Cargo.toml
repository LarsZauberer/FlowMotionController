[package]
name = "flow_motion_controller_firmware"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
cyw43 = "0.7.0"
cyw43-pio = "0.10.0"
cyw43-setup = "0.1.1"
cortex-m-rt = "0.7.6"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
] }
embassy-net = { version = "0.7.0", features = [
    "dhcpv4",
    "medium-ethernet",
    "udp",
] }
embassy-rp = { version = "0.10.0", features = [
    "time-driver",
    "critical-section-impl",
    "rp2040",
    "binary-info",
] }
embassy-time = "0.5.1"
panic-halt = "1.0.0"
static_cell = "2.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }

[package.metadata.embassy]
build = [{ target = "thumbv6m-none-eabi" }]
